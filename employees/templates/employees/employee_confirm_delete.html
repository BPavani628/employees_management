{% extends 'employees/base.html' %}

{% block title %}Confirm Delete - EMS{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-0 border-danger">
            <div class="card-header bg-danger text-white py-3">
                <h5 class="mb-0"><i class="bi bi-exclamation-triangle-fill me-2"></i>Delete Confirmation</h5>
            </div>
            <div class="card-body p-4 text-center">
                <p class="fs-5">Are you sure you want to delete the record for:</p>
                <p class="fw-bold fs-4 text-danger">{{ employee.emp_id }} - {{ employee.name }}</p>
                <p class="text-muted small">This action cannot be undone.</p>
                
                <form method="POST" class="mt-4 d-flex justify-content-center gap-3">
                    {% csrf_token %}
                    <a href="{% url 'employee_list' %}" class="btn btn-secondary px-4">Cancel</a>
                    <button type="submit" class="btn btn-danger px-4">Yes, Delete</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
